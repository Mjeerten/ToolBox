name: video
# Paste video links and/or account links (TikTok @user, YouTube channel, Instagram...). For each video the runner saves
# frames, contact sheets, on-screen text (OCR), a speech transcript and caption info (tools/video.py); for an account
# also an index of its videos, and the newest `max` are processed. Output is committed to the separate `videos` branch
# so Claude can read it; main stays clean. Public repo on purpose: Actions minutes are free.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Video or account link(s), separated by spaces"
        required: true
      every:
        description: "Seconds between saved frames"
        default: "1"
      max:
        description: "Accounts: how many of the newest videos to process"
        default: "10"

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr >/dev/null
          pip install -q -U yt-dlp faster-whisper numpy pillow
          cp tools/video.py /tmp/video.py
      - name: Switch to the videos branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin videos; then
            git checkout -B videos FETCH_HEAD
          else
            git checkout --orphan videos && git rm -rfq . && git clean -fdq
            echo "Video frames + transcripts made by .github/workflows/video.yml (on main)." > README.md
          fi
      - name: Process links
        timeout-minutes: 130   # leaves time to commit whatever is done
        env:
          URLS: ${{ inputs.urls }}
          EVERY: ${{ inputs.every || '1' }}
          MAX: ${{ inputs.max || '10' }}
        run: python /tmp/video.py --out videos --every "$EVERY" --max "$MAX" $URLS
      - name: Commit to the videos branch
        if: always()
        run: |
          git add -A videos README.md 2>/dev/null || git add -A videos
          git commit -qm "Videos (${{ github.run_id }})" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do git push -q origin videos && break; git pull -q --rebase origin videos; done
